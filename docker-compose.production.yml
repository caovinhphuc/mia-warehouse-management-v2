services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: mia-reverse-proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "80:80"
      # Enable when SSL certs are mounted and configured in nginx file.
      # - "443:443"
    volumes:
      - ./deploy/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public-net
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_API_BASE_URL: /api
    container_name: mia-frontend
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mia-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      AI_SERVICE_URL: http://ai-service:8000
      # Fallback for local deploy; set JWT_SECRET in environment for real production.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-production}
    env_file:
      - ./backend/.env
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.ai
    container_name: mia-ai-service
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 8s
      retries: 5

networks:
  public-net:
    driver: bridge
  app-net:
    driver: bridge
